<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Povy - Mis cuentas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#22c55e', primaryDark: '#16a34a' } } } };
  </script>
  <style>body { background: radial-gradient(circle at top, #1f2937 0, #020617 45%, #000 100%); }</style>
</head>
<body data-requires-auth="true" class="min-h-screen flex flex-col text-slate-100">
  <header class="relative z-50 border-b border-slate-800/80 bg-slate-950/80 backdrop-blur">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <div class="h-8 w-8 rounded-full bg-gradient-to-br from-primary to-emerald-400 flex items-center justify-center text-xs font-bold">PV</div>
        <div><p class="text-sm font-semibold">Povy</p><p class="text-[11px] text-slate-400">Mis cuentas</p></div>
      </div>
      <nav class="hidden md:flex items-center gap-5 text-xs text-slate-300">
        <a href="../index.html" class="hover:text-emerald-300">Inicio</a>
        <a href="accounts.html" class="text-emerald-300">Cuentas</a>
        <a href="payments.html" class="hover:text-emerald-300">Pagos</a>
        <a href="docs.html" class="hover:text-emerald-300">Docs API</a>
      </nav>
      <div class="hidden md:flex items-center gap-2 text-xs">
        <span class="text-slate-300">Usuario: <span data-auth-name class="font-semibold text-emerald-300"></span></span>
        <button data-action="logout" class="px-3 py-1.5 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-100">Salir</button>
      </div>
      <button id="nav-toggle" class="md:hidden inline-flex items-center justify-center h-9 w-9 rounded-full bg-primary hover:bg-primaryDark text-slate-950 text-sm font-bold">≡</button>
    </div>
    <div id="mobile-nav" class="md:hidden hidden absolute left-0 right-0 top-full border-t border-slate-800/80 bg-slate-950/95 z-40">
      <nav class="max-w-6xl mx-auto px-4 py-3 flex flex-col gap-2 text-[11px] text-slate-300">
        <a href="../index.html">Inicio</a>
        <a href="accounts.html">Cuentas</a>
        <a href="payments.html">Pagos</a>
        <a href="docs.html">Docs API</a>
        <button data-action="logout" class="text-left">Salir</button>
      </nav>
    </div>
  </header>

  <main class="flex-1 max-w-6xl mx-auto px-4 py-8 space-y-6">
    <section class="grid lg:grid-cols-[1fr,1.1fr] gap-6">
      <div class="rounded-xl border border-slate-800 bg-slate-950/80 p-5 space-y-4">
        <div>
          <p class="text-[11px] uppercase tracking-[0.14em] text-slate-400">Nueva cuenta</p>
            <h1 class="text-lg font-semibold">Crea una cuenta para probar tarjetas sandbox</h1>
        </div>
        <div class="grid gap-3 text-sm">
          <input id="ownerName" type="text" maxlength="40" placeholder="Titular opcional" class="w-full rounded-md bg-slate-900 border border-slate-700 px-3 py-2 outline-none focus:border-emerald-400" />
          <div class="grid sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-[11px] text-slate-400 mb-1">Moneda inicial</label>
              <select id="new-account-currency" class="w-full rounded-md bg-slate-900 border border-slate-700 px-3 py-2 outline-none focus:border-emerald-400">
                <option value="USD">USD</option>
                <option value="MXN">MXN</option>
                <option value="JPY">JPY</option>
                <option value="EUR">EUR</option>
              </select>
            </div>
            <div>
              <label class="block text-[11px] text-slate-400 mb-1">Saldo inicial</label>
              <input id="initialBalance" type="number" step="0.01" value="10000" class="w-full rounded-md bg-slate-900 border border-slate-700 px-3 py-2 outline-none focus:border-emerald-400" />
            </div>
          </div>
          <button id="btn-create-account" class="rounded-md bg-primary hover:bg-primaryDark text-slate-950 font-semibold py-2">Crear cuenta</button>
        </div>
      </div>

      <div class="rounded-xl border border-slate-800 bg-slate-950/80 p-5 space-y-3">
        <div class="flex items-center justify-between gap-2">
          <div>
            <p class="text-[11px] uppercase tracking-[0.14em] text-slate-400">Tus cuentas</p>
            <h2 class="text-lg font-semibold">Tus cuentas privadas para tarjetas Povy</h2>
          </div>
          <a href="payments.html" class="text-xs text-emerald-300 hover:text-emerald-200">Ir a pagos</a>
        </div>
        <p id="accounts-empty" class="text-[11px] text-slate-500">Cargando cuentas...</p>
        <div id="accounts-list" class="grid gap-3 sm:grid-cols-2 text-xs"></div>
      </div>
    </section>
  </main>

  <footer class="border-t border-slate-800/80 mt-6">
    <div class="max-w-6xl mx-auto px-4 py-4 text-[11px] text-slate-500 flex items-center justify-between">
      <span>Povy Sandbox · Cuentas privadas por usuario</span>
      <span id="year"></span>
    </div>
  </footer>

  <script src="../js/main.js"></script>
</body>
</html>
